name: Review checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: review-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Owner permanent restructuring mandate, 10 November 2026.
# No full-suite shards, static-source projection pins or release-specific helper loops.
jobs:
  worker:
    name: worker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Scan repository history for secrets
        run: bash scripts/scan-secrets.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
        working-directory: worker
      - name: TypeScript and targeted genuine Workerd D1 behavior
        run: npm run qualify -- --target lease --target treasury
        working-directory: worker

  addon:
    name: addon
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install existing LuaJIT bridge
        run: python3 -m pip install --user 'lupa==2.8'
      - name: Bounded 1000-member Lua performance benchmark
        run: python3 addon/tests/run_lua_suites.py --suite performance235

  backup:
    name: backup
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No production credentials or export in CI. A fresh production export is
      # checked by this same tool immediately before each authorized deployment.
      - name: SQLite backup checker regression cases
        run: python3 -m unittest discover -s scripts/tests -p test_check_d1_backup.py
      - name: Restore current schema SQL and verify SQLite integrity
        run: python3 scripts/check-d1-backup.py worker/schema.sql --format sql
      - name: Required CI result gate failure cases
        run: bash scripts/tests/ci-gate.test.sh

  # Preserve the existing required status. Missing, failed, skipped and cancelled
  # dependencies fail; no placeholder shard statuses are reported as success.
  check:
    name: check
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    needs: [worker, addon, backup]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require every qualification job to succeed
        env:
          WORKER: ${{ needs.worker.result }}
          ADDON: ${{ needs.addon.result }}
          BACKUP: ${{ needs.backup.result }}
        run: bash scripts/ci-gate.sh
