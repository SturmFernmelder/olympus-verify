name: Review checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: review-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Owner permanent restructuring mandate, 10 November 2026.
# No full-suite shards, static-source projection pins or release-specific helper loops.
# Evergreen 12 November 2026 (CL2-022, CL2-023, CL2-182): the directive's gate runs in full under the same four
# required job names. The addon job runs every Lua suite that needs no external archive; the worker job adds the
# generated-artifact parity checks and the complete Watcher suite, with Lupa installed by hash so the Watcher's Lua
# round trips run instead of skipping. Local timings are in docs/release-qualification.md.
jobs:
  worker:
    name: worker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Scan repository history for secrets
        run: bash scripts/scan-secrets.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
        working-directory: worker
      - name: Generated policy pages, Link core, code vectors and served addon package match their sources
        run: |
          npm run check:policies
          npm run check:link-core
          npm run check:vectors
          node ../scripts/build-verify-addon.cjs --check
        working-directory: worker
      # CL2-076 (owner ruling of 13 Nov 2026): members keep app.js and app.css of a BUILD in their browser for a year,
      # so a change to either file must ship with a new BUILD. Exit 3 (no base to compare) fails the step too.
      - name: Script and style changes come with a new BUILD
        env:
          ASSET_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: |
          node scripts/tests/check-asset-build.test.cjs
          node scripts/check-asset-build.cjs --base "$ASSET_BASE"
      - name: TypeScript, targeted genuine Workerd D1 behavior, D1 statement ceilings and query plans
        run: npm run qualify -- --target lease --target treasury --target reconciliation --target promotions
        working-directory: worker
      - name: Concurrent sweep progress and completed-erasure regression
        run: |
          node tests/lane_progress280_test.cjs --layout canonical --only ordinary-last,ban-last,erase-late,read-unknown --out "$RUNNER_TEMP/role-progress-canonical"
          node tests/lane_progress280_test.cjs --layout recorded-live-pre-seal-20261017 --only ordinary-last,ban-last,erase-late,read-unknown --out "$RUNNER_TEMP/role-progress-recorded"
          node tests/cursor_retired_followup280_workerd_test.cjs --layout canonical --out "$RUNNER_TEMP/retired-progress-canonical"
          node tests/cursor_retired_followup280_workerd_test.cjs --layout recorded-live-pre-seal-20261017 --out "$RUNNER_TEMP/retired-progress-recorded"
          node tests/neutral_existing_followup280_workerd_test.cjs --out "$RUNNER_TEMP/neutral-existing"
          node tests/neutral_lineage_followup280_workerd_test.cjs --out "$RUNNER_TEMP/neutral-lineage"
        working-directory: worker
      - name: Install the hash-pinned LuaJIT bridge for the Watcher's Lua round trips
        run: python3 -m pip install --user --require-hashes --no-deps -r addon/tests/requirements-lupa.txt
      - name: Complete Watcher suite
        env:
          OLYMPUS_REQUIRE_LUA: '1'
        run: python3 -m unittest discover -s watcher/tests

  addon:
    name: addon
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the hash-pinned LuaJIT bridge
        run: python3 -m pip install --user --require-hashes --no-deps -r addon/tests/requirements-lupa.txt
      - name: Every offline Lua suite, including the 1000-member performance benchmark
        run: python3 addon/tests/run_lua_suites.py --all-offline

  backup:
    name: backup
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No production credentials or export in CI. A fresh production export is
      # checked by this same tool immediately before each authorized deployment.
      - name: SQLite backup checker regression cases
        run: python3 -m unittest discover -s scripts/tests -p test_check_d1_backup.py
      - name: Restore current schema SQL and verify SQLite integrity
        run: python3 scripts/check-d1-backup.py worker/schema.sql --format sql
      - name: Required CI result gate failure cases
        run: bash scripts/tests/ci-gate.test.sh

  # Preserve the existing required status. Missing, failed, skipped and cancelled
  # dependencies fail; no placeholder shard statuses are reported as success.
  check:
    name: check
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    needs: [worker, addon, backup]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require every qualification job to succeed
        env:
          WORKER: ${{ needs.worker.result }}
          ADDON: ${{ needs.addon.result }}
          BACKUP: ${{ needs.backup.result }}
        run: bash scripts/ci-gate.sh
