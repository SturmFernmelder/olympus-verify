name: Review checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: review-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Owner permanent restructuring mandate, 10 November 2026.
# No full-suite shards, static-source projection pins or release-specific helper loops.
# Evergreen 12 November 2026 (CL2-022, CL2-023, CL2-182): the directive's gate runs in full under the same four
# required job names. The addon job runs every Lua suite that needs no external archive; the worker job adds the
# generated-artifact parity checks and the complete Watcher suite, with Lupa installed by hash so the Watcher's Lua
# round trips run instead of skipping. Local timings are in docs/release-qualification.md.
jobs:
  worker:
    name: worker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Scan repository history for secrets
        run: bash scripts/scan-secrets.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
        working-directory: worker
      - name: Generated policy pages, Link core, code vectors and served addon package match their sources
        run: |
          npm run check:policies
          npm run check:link-core
          npm run check:vectors
          node ../scripts/build-verify-addon.cjs --check
        working-directory: worker
      # CL2-076 (owner ruling of 13 Nov 2026): members keep app.js and app.css of a BUILD in their browser for a year,
      # so a change to either file must ship with a new BUILD. Exit 3 (no base to compare) fails the step too.
      - name: Script and style changes come with a new BUILD
        env:
          ASSET_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: |
          node scripts/tests/check-asset-build.test.cjs
          node scripts/check-asset-build.cjs --base "$ASSET_BASE"
      - name: TypeScript, targeted genuine Workerd D1 behavior, D1 statement ceilings and query plans
        run: npm run qualify -- --target lease --target treasury --target reconciliation --target promotions
        working-directory: worker
      - name: Held-read diagnostics, uncertain writes and explicit page retry
        timeout-minutes: 4
        run: |
          node tests/held_cause_labels_test.cjs
          node tests/sync503_held_workerd_test.cjs
          node tests/sync503_page_test.cjs
          node tests/community_census_route_test.cjs --focus=closed-logs
          node tests/resources_admission169_test.cjs --focus=closed-logs
        working-directory: worker
      - name: Current native ranks and private attended role audit
        timeout-minutes: 4
        run: |
          node tests/directive_rank280_workerd_test.cjs --steward --only new0,new1,new7,new8,new9,member-with-alt --out "$RUNNER_TEMP/steward-ranks"
          node tests/directive_rank280_workerd_test.cjs --steward --v1 --out "$RUNNER_TEMP/serving-v1-real-steward"
          node tests/directive_rank280_workerd_test.cjs --steward --only verify-member-with-alt --out "$RUNNER_TEMP/steward-linked-alt-ingress"
          node tests/directive_rank280_workerd_test.cjs --steward --only entitlement-never-sent,entitlement-unknown-child,entitlement-blocker --out "$RUNNER_TEMP/entitlement-custody"
          node tests/role_delete_refusal280_workerd_test.cjs --only transition-manual-cycle,transition-ban-manual-cycle --out "$RUNNER_TEMP/fixed-manual-refusals"
          node tests/role_delete_refusal280_workerd_test.cjs --only transition-refusal404,transition-banrefusal404,transition-refusal429,transition-banrefusal429 --out "$RUNNER_TEMP/fixed-status-refusals"
          node tests/role_delete_refusal280_workerd_test.cjs --only transition-migration-never-sent,transition-migration-unknown-child,transition-observation-not-absent --out "$RUNNER_TEMP/migration-custody"
          node tests/manual_refusal_ui280_workerd_test.cjs --out "$RUNNER_TEMP/generic-manual-refusal-ui"
          node tests/canonical_never_sent284_test.cjs
          node tests/native_base_cleanup284_workerd_test.cjs --out "$RUNNER_TEMP/native-base-cleanup"
          node tests/site_role_audit283_workerd_test.cjs
          node tests/site_role_audit283_ui_test.cjs
          node tests/directive_promotion_intent_test.cjs
          node tests/stored_application_intent283_test.cjs
          node ../scripts/tests/verify-addon-download.test.cjs
        working-directory: worker
      - name: Original preview expiry across the final D1 response
        timeout-minutes: 3
        working-directory: worker
        run: node tests/site_role_audit283_workerd_test.cjs --only final-d1-expired
      - name: Concurrent sweep progress and completed-erasure regression
        run: |
          node tests/lane_progress280_test.cjs --layout canonical --only ordinary-last,ban-last,erase-late,read-unknown --out "$RUNNER_TEMP/role-progress-canonical"
          node tests/lane_progress280_test.cjs --layout recorded-live-pre-seal-20261017 --only ordinary-last,ban-last,erase-late,read-unknown --out "$RUNNER_TEMP/role-progress-recorded"
          node tests/cursor_retired_followup280_workerd_test.cjs --layout canonical --out "$RUNNER_TEMP/retired-progress-canonical"
          node tests/cursor_retired_followup280_workerd_test.cjs --layout recorded-live-pre-seal-20261017 --out "$RUNNER_TEMP/retired-progress-recorded"
          node tests/neutral_existing_followup280_workerd_test.cjs --out "$RUNNER_TEMP/neutral-existing"
          node tests/neutral_lineage_followup280_workerd_test.cjs --out "$RUNNER_TEMP/neutral-lineage"
          node tests/note_first_verification280_workerd_test.cjs --out "$RUNNER_TEMP/note-first-verification"
          node tests/rank_effect_depth280_workerd_test.cjs --ci --out "$RUNNER_TEMP/rank-effect-depth"
        working-directory: worker
      - name: Install the hash-pinned LuaJIT bridge for the Watcher's Lua round trips
        run: python3 -m pip install --user --require-hashes --no-deps -r addon/tests/requirements-lupa.txt
      - name: Complete Watcher suite
        env:
          OLYMPUS_REQUIRE_LUA: '1'
        run: python3 -m unittest discover -s watcher/tests

  addon:
    name: addon
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the hash-pinned LuaJIT bridge
        run: python3 -m pip install --user --require-hashes --no-deps -r addon/tests/requirements-lupa.txt
      - name: Every offline Lua suite, including the 1000-member performance benchmark
        run: python3 addon/tests/run_lua_suites.py --all-offline
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
        working-directory: worker
      # Keep the four required job names and existing deadlines. Bounded recovery
      # checks run here; the independent 121-second case runs in backup below.
      - name: Verification recovery, new grant-only decisions and original PUT refusals
        working-directory: worker
        run: |
          bash ../scripts/deploy-commit.sh HEAD --dry-run --outdir "$RUNNER_TEMP/baseline-release"
          node tests/role_baseline285_workerd_test.cjs --release-bundle "$RUNNER_TEMP/baseline-release/index.js"
          node tests/directive_rank280_workerd_test.cjs --selection --steward --v1 --release-bundle "$RUNNER_TEMP/baseline-release/index.js" --out "$RUNNER_TEMP/v1-knight293"
          node tests/role_put_refusal285_workerd_test.cjs --out "$RUNNER_TEMP/put-refusal285"
          node tests/site_role_put_refusal_retry285_workerd_test.cjs --out "$RUNNER_TEMP/attended-put285"
          node tests/role_delete_refusal280_workerd_test.cjs --only transition-put-refusal403,transition-put-refusal404,transition-put-refusal429,transition-put-unknown500 --out "$RUNNER_TEMP/put-writer285"
          node tests/linked_proof_refresh285_workerd_test.cjs --out "$RUNNER_TEMP/fresh-proof285"
          node tests/late_proof285_workerd_test.cjs --out "$RUNNER_TEMP/late-proof285"
          node tests/routine_legacy_left295_workerd_test.cjs --out "$RUNNER_TEMP/beta-left295"
          node tests/watcher_late_origin285_workerd_test.cjs
          node tests/site_role_audit285_ui_test.cjs
          node tests/late_proof285_ui_test.cjs
          node tests/directive_rank280_workerd_test.cjs --steward --v1 --selection --out "$RUNNER_TEMP/selected-member285"
      - name: Actual selected Worker result passes through Watcher and Guild readiness
        env:
          OLYMPUS_REQUIRE_LUA: '1'
        run: |
          cases=("$RUNNER_TEMP/selected-member285"/after-*/new9.json)
          test "${#cases[@]}" -eq 1
          python3 addon/tests/check_v1_selected_pipeline285.py --case "${cases[0]}" --out "$RUNNER_TEMP/selected-member285-pipeline"
  backup:
    name: backup
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No production credentials or export in CI. A fresh production export is
      # checked by this same tool immediately before each authorized deployment.
      - name: SQLite backup checker regression cases
        run: python3 -m unittest discover -s scripts/tests -p test_check_d1_backup.py
      - name: Private verification inventory preserves opposing senders and original records
        run: python3 -m unittest discover -s scripts/tests -p test_prepare_late_verification285.py
      - name: Restore current schema SQL and verify SQLite integrity
        run: python3 scripts/check-d1-backup.py worker/schema.sql --format sql
      - name: Required CI result gate failure cases
        run: bash scripts/tests/ci-gate.test.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
        working-directory: worker
      # The original real-clock assertion is unchanged. Its wait has a separate
      # job from the expanding recovery cases; neither deadline is increased.
      - name: Never-sent DELETE custody survives expiry and a later fresh pass
        timeout-minutes: 3
        working-directory: worker
        run: node tests/site_role_audit283_workerd_test.cjs --only final-d1-delete-expired

  # Preserve the existing required status. Missing, failed, skipped and cancelled
  # dependencies fail; no placeholder shard statuses are reported as success.
  check:
    name: check
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    needs: [worker, addon, backup]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require every qualification job to succeed
        env:
          WORKER: ${{ needs.worker.result }}
          ADDON: ${{ needs.addon.result }}
          BACKUP: ${{ needs.backup.result }}
        run: bash scripts/ci-gate.sh
