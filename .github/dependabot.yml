version: 2
updates:
  - package-ecosystem: npm
    directory: /worker
    schedule:
      interval: weekly
      day: monday
      time: '10:00'
      timezone: America/Chicago
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      development-dependencies:
        dependency-type: development
        # Major upgrades stay in separate PRs for compatibility review.
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '10:00'
      timezone: America/Chicago
    open-pull-requests-limit: 2
