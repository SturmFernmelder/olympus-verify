title = "Olympus Verify secret scanning"

[extend]
useDefault = true
# Discord snowflakes (server, channel, role and application ids) identify things; they do not authenticate anything.
# Bot-token and client-secret rules stay on.
disabledRules = ["discord-client-id"]

# .65 (1 Oct 2026; Codex's Gitleaks review of the .51 snapshot, 02:21 UTC): no broad allowlist. The offline suites'
# deterministic test secrets trigger no default rule (verified with 8.30.1 over the whole tree), so they need none; the
# one placeholder the default rules flag is the literal PASTE_TOKEN_HERE in a walkthrough's curl lines, allowed by its
# exact text in that one file. A plausible value with an incidental word like "test" in it is never suppressed.
[[allowlists]]
description = "The walkthrough's curl examples carry the literal placeholder PASTE_TOKEN_HERE, never a token"
targetRules = ["curl-auth-header"]
condition = "AND"
paths = ['''^docs/asmongold-move-walkthrough\.md$''']
regexTarget = "match"
regexes = ['''Authorization: Bearer PASTE_TOKEN_HERE"''']

# The dormant privacy contract fixture signs only synthetic local requests. Limit the exception to its exact
# fixed literal and file; plausible credentials elsewhere continue to fail the whole-history scan.
[[allowlists]]
description = "Privacy foundation's exact synthetic local fixture secret"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^worker/tests/privacy_foundation129_contract_test\.cjs$''']
regexTarget = "match"
regexes = ["secret = 'SYNTHETIC-FOUNDATION129-HMAC'"]

# sign(secret, purpose, data) takes the credential from env.COOKIE_SECRET. This fixed second argument is
# the public HMAC purpose label, not a credential. The whole-history scan still examines this file and rule.
[[allowlists]]
description = "Privacy subject HMAC's exact public purpose label"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^worker/src/privacy-serving-authority\.ts$''']
regexTarget = "match"
regexes = ['''^env\.COOKIE_SECRET,'privacy-denial-v1'$''']

[[allowlists]]
description = "QR key-context HMAC public purpose labels in their exact implementation and adversarial fixtures"
targetRules = ["generic-api-key"]
condition = "AND"
paths = [
  '''^worker/src/qr-phase1\.ts$''',
  '''^worker/tests/qr_phase1_test\.cjs$''',
]
regexTarget = "secret"
regexes = [
  '''^qr-key-revocation-v1$''',
  '''^qr-key-enrollment-v1$''',
]

